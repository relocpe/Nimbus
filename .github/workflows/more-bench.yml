name: More-page bench

# Opens the real panel's pages on a Mac runner and compares a build of the base commit with this branch.
on:
  workflow_dispatch:
  push:
    branches: [ci-more]

env:
  BASE: 41a95bb

jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Typecheck the app
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          xcrun swiftc -typecheck -parse-as-library -sdk "$SDK" -target "$(uname -m)-apple-macos14.0" \
            macos/App/ZapretMacApp.swift macos/App/NimbusDesign.swift macos/App/NimbusHUD.swift macos/App/NimbusSupport.swift macos/App/VpnDetect.swift
      - name: Build before and after
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p before
          for f in NimbusDesign NimbusHUD NimbusSupport; do git show $BASE:macos/App/$f.swift > before/$f.swift; done
          build() {
            xcrun swiftc -O -parse-as-library -sdk "$SDK" -target "$(uname -m)-apple-macos14.0" $3 \
              -framework AppKit -framework SwiftUI -framework QuartzCore \
              "$1/NimbusDesign.swift" "$1/NimbusHUD.swift" "$1/NimbusSupport.swift" macos/App/VpnDetect.swift macos/Screenshots/BenchHUD.swift -o "$2"
          }
          build before bench-before
          build macos/App bench-after "-D PREWARM -D EAGER"
      - name: Bench
        run: |
          export RB_USE_BINARY_ARCHIVE=0 RB_DISABLE_GPU=1
          mkdir -p out
          for i in 1 2 3 4; do
            ./bench-before | tee "out/before-$i.txt"
            ./bench-after | tee "out/after-$i.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: more-bench
          path: out/
