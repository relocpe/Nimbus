name: Release macOS artifact

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.0"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: bash ./macos/build.sh

      - name: Check archive
        run: |
          ZIP=dist/Nimbus-macOS-universal.zip
          test -s "$ZIP"
          unzip -p "$ZIP" Nimbus.app/Contents/Info.plist > /tmp/Nimbus-Info.plist
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /tmp/Nimbus-Info.plist)
          TAG_VERSION=$(printf '%s' "$TAG" | sed -E 's/^[vV]//; s/-.*$//')
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "App version $APP_VERSION does not match tag $TAG"
            exit 1
          fi
          lipo -archs build/macos/Nimbus.app/Contents/MacOS/Nimbus
          lipo build/macos/Nimbus.app/Contents/MacOS/Nimbus -verify_arch x86_64 arm64
          lipo build/macos/Nimbus.app/Contents/Resources/Payload/bin/utunws -verify_arch x86_64 arm64

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Nimbus-macOS-universal.zip --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" dist/Nimbus-macOS-universal.zip \
              --repo "${{ github.repository }}" \
              --title "Nimbus $TAG" \
              --generate-notes
          fi
