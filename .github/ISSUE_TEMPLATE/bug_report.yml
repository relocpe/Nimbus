name: Баг
description: Что-то не работает
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Перед отправкой уберите из логов имя пользователя, IP и другие личные данные.
  - type: input
    id: macos
    attributes:
      label: Версия macOS и чип
      placeholder: macOS 14.5, Apple Silicon
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия Nimbus
      description: Внизу раздела «Ещё».
    validations:
      required: true
  - type: input
    id: strategy
    attributes:
      label: Стратегия и пресет IPSet
      placeholder: general-simple-fake, пресет «Нет»
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Что нажимали, что ожидали, что получилось. Работает ли VPN, какой DNS.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи
      description: «Ещё» → «Логи» → «Копировать». Личные данные удалите.
      render: text
